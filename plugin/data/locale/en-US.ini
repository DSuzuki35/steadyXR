FilterName="VR Stabilizer"
GamingPC="Gaming PC IPv4 address"
GamingPC.Description="Enter the gaming PC's LAN IPv4 address printed by vrst-sender. Leave blank to disconnect. For a local test use 127.0.0.1."
Port="UDP port"
Port.Description="Must match the sender's --port value. The default is 42424."
AutomaticFOV="Use automatic full-eye FOV"
AutomaticFOV.Description="Use SteamVR's per-eye projection only when the trimmed capture is the complete selected eye. A cropped or zoomed game companion view needs manual FOV calibration. Keeps the last valid projection during tracking loss; uses manual FOV until projection data arrives."
HorizontalFOV="Horizontal FOV"
VerticalFOV="Vertical FOV"
ManualFOV.Description="Angular field of view of the image remaining AFTER input edge trimming. Match the captured view; this is not necessarily the headset's full-eye FOV."
Delay="Tracking delay"
Delay.Description="Use the pose from this many milliseconds before OBS renders the video. Includes capture-card and OBS buffering. Increase until correction aligns with the captured motion. This control does not delay the video."
Smoothing="Smoothing"
Smoothing.Description="0 disables motion smoothing exactly. Higher values make the view steadier but consume more motion margin. Pose horizon leveling is controlled separately."
StabilizationCrop="Stabilization crop"
StabilizationCrop.Description="Reserve image margin for stabilization correction. More crop permits more correction. Correction is reduced automatically before it would expose an empty edge."
FramingZoom="Framing zoom"
FramingZoom.Description="Additional final zoom, applied with stabilization in one GPU sample. Also provides more room for correction."
Output16x9="Fill a 16:9 output"
Output16x9.Description="Crop to fill 16:9 without stretching. When disabled, retain the trimmed input aspect ratio."
FramingX="Horizontal framing offset"
FramingX.Description="Move the final crop within the available horizontal margin: negative left, positive right."
FramingY="Vertical framing offset"
FramingY.Description="Move the final crop within the available vertical margin: negative up, positive down."
InputLeft="Input trim: left"
InputRight="Input trim: right"
InputTop="Input trim: top"
InputBottom="Input trim: bottom"
InputTrim.Description="Remove this percentage of the original source edge, for example a black bar or window border. Enter manual FOV for the remaining image. Each edge allows 0–45%."
RefreshDiagnostics="Refresh diagnostics"
ResetSmoothing="Reset smoothing"
ResetSmoothing.Description="Clear motion history and restart from the next pose or image frame. Keeps timing, crop, framing and algorithm settings."
Status.NotCreated="Create the filter and select SteamVR pose or image-based microjitter."
Status.Connection="Connection"
Status.Clock="Clock sync"
Status.Ready="Ready"
Status.Waiting="Waiting"
Status.RTT="Round trip"
Status.Tracking="Tracking"
Status.Valid="Valid pose"
Status.NoCorrection="No aligned pose; showing normal framing"
Status.Age="Selected pose age"
Status.Mode="Pose mode"
Status.Demo="Synthetic demo"
Status.Frame="Compositor frame history"
Status.Live="Live pose fallback"
Status.Packets="Accepted packets"
Status.Rejected="Rejected packets"
Status.Output="Output"
Status.Correction="Available correction"
Status.AutoFOV="FOV: last received full-eye projection"
Status.ManualFallback="FOV: manual fallback while waiting for projection"
Status.RefreshHint="Reopen this panel or press Refresh diagnostics for current status."
Mode="Stabilization algorithm"
Mode.Pose="SteamVR pose"
Mode.Image="Image-based microjitter"
HorizonLevel="Horizon leveling"
HorizonLevel.Description="Remove head tilt relative to SteamVR tracking up while retaining the viewing direction. Works independently of motion smoothing. Fades near vertical gaze; cannot remove unknown car or track banking."
HorizonMax="Maximum horizon correction"
HorizonMax.Description="Limit the roll correction from horizon leveling. Available crop can reduce this further."
Image.MaxShift="Maximum image shift"
Image.MaxShift.Description="Maximum horizontal and vertical correction as a percentage of the trimmed image. The available crop can reduce this further."
Image.MaxRoll="Maximum image roll"
Image.MaxRoll.Description="Maximum roll correction in degrees. Start small for microjitter; the available crop can reduce this further."
Image.TrackRoll="Correct image roll"
Image.TrackRoll.Description="Track small image rotations as well as horizontal and vertical movement. Disable for translation-only correction."
Image.RegionLeft="Tracking region: left margin"
Image.RegionRight="Tracking region: right margin"
Image.RegionTop="Tracking region: top margin"
Image.RegionBottom="Tracking region: bottom margin"
Image.Region.Description="Exclude this percentage of the trimmed input from feature tracking. Select stable cockpit structure and exclude mirrors, steering wheels, moving scenery and overlays. Opposing margins retain at least 6% of the image."
Image.Warming="Preparing image tracking; showing normal framing"
Image.Tracking="Tracking image features"
Image.Weak="Weak or inconsistent features; gently releasing correction"
Image.SceneChange="Scene changed; restarting image tracking"
Image.Invalid="Analysis unavailable; showing normal framing"
Image.Confidence="Confidence"
Image.Inliers="Inliers / tracked features"
Image.Processing="Analysis time"
Image.Delay="Video delay: one OBS frame after warm-up (16.7 ms at 60 fps)"

Mode.Hybrid="Hybrid: pose + image cleanup"
Compare="A/B: show unstabilized picture"
Compare.Description="Show the same captured frame with the same crop and latency, but without correction. Estimation continues. Bind the comparison hotkey in OBS Settings > Hotkeys."
Compare.Hotkey="HorizonLock: toggle matched A/B comparison"
Axes="Use separate smoothing for each axis"
Axes.Yaw="Yaw / horizontal smoothing"
Axes.Pitch="Pitch / vertical smoothing"
Axes.Roll="Roll smoothing"
Axes.Description="Independent motion smoothing. Zero follows that axis directly. Horizon leveling remains independent."
TurnFollow="Follow deliberate turns faster"
TurnFollow.Description="Reduce lag during sustained head turns. Signed velocity averaging helps distinguish a turn from alternating jitter. Zero preserves normal smoothing."
TurnSpeed="Turn-follow reference speed"
TurnSpeed.Description="Speed at which turn following reaches its full effect. Image mode uses an approximate 90-degree field; this is a sensitivity control there."
AutoCrop="Automatically add crop for stronger movement"
AutoCrop.Extra="Maximum additional crop"
AutoCrop.Speed="Crop increase speed"
AutoCrop.Description="Starts at your stabilization crop and adds only what correction needs, up to this extra amount and 40% total. Returns at half the increase speed. Correction stays limited while crop catches up."
AutoCrop.Effective="Current stabilization crop"
Preset.Name="Game / car preset"
Preset.Description="Type a name to save, or choose an existing name to load/delete. Up to 32 presets per filter. Saving an existing name replaces it. Network address and A/B state stay unchanged."
Preset.Save="Save preset"
Preset.Load="Load preset"
Preset.Delete="Delete preset"
Preset.Next="HorizonLock: load next saved preset"
Preset.Success="Preset updated."
Preset.Failed="Enter a name (1–64 characters), choose an existing preset to load/delete, or remove a preset if the 32-preset limit is reached."
Calibration.Start="Start parked-car calibration"
Calibration.Finish="Finish and analyze"
Calibration.Apply="Apply suggested delay and FOV"
Calibration.Description="Use a stationary, textured cockpit region. During collection, video is normally framed and buffered by one frame without correction. Keep the car parked; vary your small head movements on both axes. Suggestions estimate the captured mirror, not headset optics. Refresh diagnostics to see progress. Applying disables automatic full-eye FOV."
