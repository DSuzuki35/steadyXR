SourceName="SteadyXR"
AutoStart="Automatically start and close SteadyXR"
Application="SteadyXR application"
LifecycleHint="Starts SteadyXR in direct OBS mode when an enabled source is loaded. Closes it gracefully when the last enabled source is removed, the option is disabled, or OBS exits. An already running SteadyXR is never closed. Change the application path if you move the SteadyXR folder."
Instructions="Keep SteadyXR running and select Direct OBS output plugin in its output settings. This source receives the final stabilized GPU image, including framing, effects and overlays. Use the same graphics card for OBS and SteadyXR. A stopped or disconnected producer becomes transparent; reconnecting is automatic. Video only; add your audio sources separately in OBS."
