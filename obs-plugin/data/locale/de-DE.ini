SourceName="SteadyXR"
AutoStart="SteadyXR automatisch starten und schließen"
Application="SteadyXR-Anwendung"
LifecycleHint="Startet SteadyXR im direkten OBS-Modus beim Laden einer aktivierten Quelle. Schließt die selbst gestartete Anwendung regulär, wenn die letzte aktivierte Quelle entfernt, die Option deaktiviert oder OBS beendet wird. Eine bereits laufende SteadyXR-Anwendung wird nie geschlossen. Nach dem Verschieben des SteadyXR-Ordners den Anwendungspfad aktualisieren."
Instructions="SteadyXR muss weiterlaufen. Wähle dort Direct OBS output plugin als Ausgabe. Diese Quelle empfängt das fertige stabilisierte GPU-Bild einschließlich Bildausschnitt, Effekten und Overlays. OBS und SteadyXR müssen dieselbe Grafikkarte verwenden. Bei getrennter Verbindung wird die Quelle transparent und verbindet sich automatisch erneut. Nur Video; Audioquellen separat in OBS hinzufügen."
